name: CI

on:
  push:
    branches:
      - master
      - migration/baileys-md-v6
  pull_request:
    branches:
      - master

jobs:
  syntax-and-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Install project dependencies
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Verify Baileys ESM exports
        run: |
          node --input-type=module -e "import * as m from '@whiskeysockets/baileys'; for (const key of ['default','useMultiFileAuthState','fetchLatestBaileysVersion','DisconnectReason','generateForwardMessageContent','prepareWAMessageMedia','generateWAMessageFromContent','downloadContentFromMessage','jidDecode','proto']) if (!(key in m)) throw new Error('Missing Baileys export: ' + key); console.log('Baileys ESM exports OK')"
      - name: Verify owner configuration and branding
        run: |
          node -e "const s=require('./src/setting.json'); if(s.botName!=='Laurentia-MD.V2') throw new Error('Wrong bot name'); if(!Array.isArray(s.ownerNumber)||!s.ownerNumber.length) throw new Error('Owner number missing'); if(!s.owner1?.length||!s.owner) throw new Error('Owner contact config incomplete'); console.log('Owner config OK; number retained without printing it')"
