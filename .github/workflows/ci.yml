name: CI

on:
  push:
    branches:
      - master
      - migration/baileys-md-v6
  pull_request:
    branches:
      - master

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Verify Baileys ESM import in isolation
        run: |
          mkdir -p /tmp/baileys-smoke
          cd /tmp/baileys-smoke
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund @whiskeysockets/baileys@6.7.24
          node --input-type=module -e "import('/tmp/baileys-smoke/node_modules/@whiskeysockets/baileys/lib/index.js').then(m => { for (const key of ['default','useMultiFileAuthState','fetchLatestBaileysVersion','DisconnectReason','proto']) if (!(key in m)) throw new Error('Missing Baileys export: ' + key); console.log('Baileys ESM exports OK') })"
